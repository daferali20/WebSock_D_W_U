data-ingestion:
    build: ./services/data-ingestion
    container_name: service_data_ingestion
    env_file: .env
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - trading_network

  ai-engine:
    build: ./services/ai-engine
    container_name: service_ai_engine
    env_file: .env
    depends_on:
      timescaledb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - trading_network

  api-gateway:
    build: ./services/api-gateway
    container_name: service_api_gateway
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - trading_network
