مخطط تدفق البيانات والتصميم المعماري (System Architecture Flow)

المرحلة	المكون responsible	الوظيفة التقنية
1. الإدخال اللحظي	Data Ingestion	اتصال WebSocket بـ Databento ونشر التغيرات مجزأة إلى Kafka Topic: market-ticks
2. المعالجة والتخزين	Liquidity Service	استهلاك market-ticks، حساب السيولة، تحديث Redis (key: depth:AAPL) وكتابة السلسلة الزمنية في TimescaleDB (market_data)
3. توليد الإشارة	AI Engine	جدولة كل 5 دقائق 
→
 استعلام SELECT * FROM market_data LIMIT 200 + طلب REST لـ Finnhub 
→
 تشغيل النموذج
4. البث والتنبيه	API Gateway	استلام الإشعار المكتمل ودفعه عبر WebSocket إلى dashboard-ui وتنبيه الهاتف عبر FCM
مخطط قاعدة البيانات الحجمية (TimescaleDB Schema Blueprint)

SQL
-- جدول السلاسل الزمنية لبيانات السوق
CREATE TABLE market_ticks (
    time TIMESTAMPTZ NOT NULL,
    symbol VARCHAR(10) NOT NULL,
    price NUMERIC(12, 4),
    volume INT,
    bid_depth NUMERIC(12, 2),
    ask_depth NUMERIC(12, 2)
);

-- تحويل الجدول إلى Hypertable خاص بـ TimescaleDB لتسريع استعلامات أحدث 200 نقطة
SELECT create_hypertable('market_ticks', 'time');
CREATE INDEX idx_symbol_time ON market_ticks (symbol, time DESC);
