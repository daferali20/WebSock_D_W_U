الخطوة التالية في بناء النظام:

إنشاء سكربت تهيئة جداول TimescaleDB

كتابة كود خدمة data-ingestion من Databento إلى Kafka



‫Gemini هو نموذج ذكاء اصطناعي وقد ينتج عنه أخطاء.

version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. Zookeeper (المُنسّق لخدمة كافكا)
  # ---------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: trading_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trading_network

  # ---------------------------------------------------------------------------
  # 2. Apache Kafka (موجّه الأحداث والبيانات اللحظية)
  # ---------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: trading_kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - trading_network

  # ---------------------------------------------------------------------------
  # 3. Kafka UI (لوحة تحكم مرئية لإدارة Kafka Topics والرسائل)
  # ---------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: trading_kafka_ui
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - trading_network

  # ---------------------------------------------------------------------------
  # 4. Redis (ذاكرة مؤقتة فائقة السرعة لتحليل عمق السوق اللحظي)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: trading_redis
    command: redis-server --appendonly yes --requirepass trading_secret_pass
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "trading_secret_pass", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - trading_network

  # ---------------------------------------------------------------------------
  # 5. TimescaleDB (قاعدة بيانات السلاسل الزمنية لحفظ السجلات التاريخية)
  # ---------------------------------------------------------------------------
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: trading_timescaledb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: trading_db
      POSTGRES_USER: trading_user
      POSTGRES_PASSWORD: trading_password
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading_user -d trading_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - trading_network

# ---------------------------------------------------------------------------
# الشبكة الموحدة والأحجام الدائمة (Volumes)
# ---------------------------------------------------------------------------
networks:
  trading_network:
    driver: bridge

volumes:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  redis_data:
  timescaledb_data:
