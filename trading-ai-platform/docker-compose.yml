الخطوة التالية لبدء التنفيذ

كتابة ملف docker-compose.yml لتشغيل Kafka وRedis وTimescaleDB بضغطة زر واحدة.

إعداد data-ingestion للربط مع Databento وقراءة البيانات فوراً.

كتابة ملف docker-compose.yml لتشغيل Kafka وRedis وTimescaleDB بضغطة زر واحدة.

تم إنشاء ملف docker-compose.yml المتكامل والجاهز لتشغيل جميع الخدمات الأساسية للبنية التحتية بنقرة واحدة.

رمز YML
docker-compose
 YML 
فتح
مكونات الملف والخدمات المعرفة فيه
Apache Kafka + Zookeeper:

Kafka Container: يستقبل البيانات من Databento على المنفذ الداخلي 29092 والخارجي 9092.

Zookeeper Container: إدارة وتنسيق خدمات Kafka.

Kafka UI (لوحة تحكم مرئية):

تعمل على المنفذ 8080 وتمكنك من مراقبة الرسائل والـ Topics وتدفق الأحداث مباشرة عبر المتصفح.

Redis:

محمي بكلمة مرور (trading_secret_pass) ويعمل على المنفذ القياسي 6379.

تم تفعيل خاصية Persistence (--appendonly yes) لضمان عدم فقدان البيانات الحالية عند إعادة التشغيل.

TimescaleDB:

تعتمد على PostgreSQL 15 مجهزة بإضافة Timescale.

إعداد اسم قاعدة البيانات trading_db ويدعم الحفظ الدائم على الحجم timescaledb_data.

Healthchecks & Networks:

جميع الخدمات تعمل داخل شبكة واحدة معزولة (trading_network).

تم إدراج فحص حالة الخدمات (healthcheck) لضمان أن Kafka لا يبدأ إلا بعد استقرار Zookeeper، وهكذا.

